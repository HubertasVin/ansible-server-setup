- name: Fedora host bootstrap + WebDAV + Reverse proxies deploy
  hosts: all
  become: true
  become_user: "{{ server_main_user }}"
  gather_facts: false
  vars_files:
    - "{{ secrets_file | default('secrets.dev.yml') }}"

  vars_prompt:
    - name: server_main_user
      prompt: "Enter main server username"
      default: "mainuser"
      private: false

    - name: server_main_password
      prompt: "Enter main server password"
      private: true

    - name: borg_repo_password
      prompt: "Enter Borg repository password"
      private: true

    - name: rclone_protondrive_password
      prompt: "Enter Proton Drive password"
      private: true

    - name: tailscale_authkey
      prompt: |-
        ─── Tailscale auth key — only used to join a node that is not on the
        tailnet yet. Leave empty if this host is already joined.
        → Add tag:server with owner autogroup:admin at:
          https://console.tailscale.com/admin/acls/visual/tags
        → Generate the key with that tag:
          https://login.tailscale.com/admin/settings/keys
        ── One-time DNS setup, outside this playbook ───────────────────────────
          1. Public DNS: an A record per name in tailnet_names pointing at this
             host's PUBLIC ip.
          2. Tailscale admin → DNS → Search Domains → Add search domain… → one
             entry per name in tailnet_names.
          3. Tailscale admin → DNS → Nameservers → Add nameserver ▾ → Custom… →
             the tailnet IP → enable "Restrict to search domain" → pick one of
             the names → Add. Toggle Use with exit node.
        ─────────────────────────────────────────────────────────────────────────
      private: true
      default: ""

    - name: openrouter_api_key
      prompt: "Enter OpenRouter API key"
      private: true

    - name: brave_api_key
      prompt: "Enter Brave API key"
      private: true

    - name: github_token
      prompt: |
        ─── GitHub fine-grained token for obsidian-sync ────────────────────────
        Generate at: https://github.com/settings/personal-access-tokens
        → Generate new token
        Repository access: Only select repositories
        Permissions → Repository permissions → Contents: Read and write
        ─────────────────────────────────────────────────────────────────────────
      private: true

    - name: gitlab_registry_username
      prompt: |
        ─── GitLab Container Registry deploy token ─────────────────────────────
        Generate at: https://gitlab.com/roamermaps/back-end/-/settings/repository
        → Deploy tokens → New deploy token
        Scope: read_registry
        ─────────────────────────────────────────────────────────────────────────
      private: false

    - name: gitlab_registry_password
      prompt: "Enter the deploy-token password"
      private: true

    - name: gitlab_deployment_token
      prompt: |
        ─── GitLab token to clone roamermaps/deployment ──────────────────────
        Generate at: https://gitlab.com/-/user_settings/personal_access_tokens
        → Add new token
        Resource access: Code
        Group and project: Code - Download
        ───────────────────────────────────────────────────────────────────────
      private: true

  vars:
    home_dir: "/home/{{ server_main_user }}"
    uid: "{{ ansible_facts.getent_passwd[server_main_user][1] }}"
    gid: "{{ ansible_facts.getent_passwd[server_main_user][2] }}"

    apps_dir: "{{ home_dir }}/apps"

    docker_image: "dgraziotin/nginx-webdav-nononsense"
    dav_dir: "{{ home_dir }}/dav_data"
    sync_script_path: "{{ home_dir }}/sync-data.sh"
    sync_log_path: "{{ home_dir }}/sync-data.log"

    tailscale_ports: [3400, 3457, 2283]
    # Tagged devices carry no node-key expiry; the tag must exist in the ACL's tagOwners.
    tailscale_tags: "tag:server"
    tailscale_up_argv: "{{ ['tailscale', 'up', '--auth-key=' + tailscale_authkey] + (['--advertise-tags=' + tailscale_tags] if tailscale_tags | length > 0 else []) }}"

    borg_user: borguser
    borg_password: "{{ borg_repo_password }}"
    borg_backup_dir: "/home/{{ borg_user }}/backups"
    borg_repo_path: "{{ borg_backup_dir }}"

    # Jellyfin media library
    media_dir: /srv/media

    aichat_dir: "{{ apps_dir }}/aichat"
    aichat_compose_path: "{{ aichat_dir }}/docker-compose.yml"
    searxng_settings_path: "{{ aichat_dir }}/settings.yml"

    immich_dir: "{{ apps_dir }}/immich-app"

    # Lector
    lector_dir: "{{ apps_dir }}/lector"
    lector_compose_path: "{{ lector_dir }}/docker-compose.yml"
    lector_uid: "1001"
    lector_gid: "1001"
    lector_api_url: "https://{{ lector_domain }}"

    # Tailnet-side TLS: nginx listens on the tailnet IP for these names and
    # dnsmasq answers them with it, so the URLs are the domains, never the IP.
    tailnet_dnsmasq_file: /etc/dnsmasq.d/tailnet-domains.conf
    tailnet_names:
      - "{{ immich_domain }}"
      - "{{ lector_domain }}"

    # k3s / RoamerMaps
    roamermaps_deployment_repo: "https://gitlab.com/roamermaps/deployment.git"
    roamermaps_k8s_dir: "{{ apps_dir }}/roamermaps/k8s"
    roamermaps_data_dir: "{{ apps_dir }}/roamermaps/data"
    roamermaps_data_files:
      - geocode.json
      - places.json
      - ranking.json
      - trails.json

  pre_tasks:
    - name: Gather facts as root (main user may not exist yet)
      become: true
      become_user: root
      ansible.builtin.setup:
      tags: always

    - name: Ensure main user exists
      become: true
      become_user: root
      ansible.builtin.user:
        name: "{{ server_main_user }}"
        state: present
        home: "{{ home_dir }}"
        shell: /bin/bash
      tags: [users]

    - name: Set password for main user
      become: true
      become_user: root
      ansible.builtin.user:
        name: "{{ server_main_user }}"
        password: "{{ server_main_password | password_hash('sha512') }}"
        update_password: always
      tags: [users]

    - name: Look up main user uid/gid
      ansible.builtin.getent:
        database: passwd
        key: "{{ server_main_user }}"
      tags: always

    - name: Enable RPM Fusion repos (Fedora)
      become: true
      become_user: root
      ansible.builtin.dnf:
        name:
          - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
          - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
        state: present
        disable_gpg_check: true
      when: ansible_facts['os_family'] == "RedHat"
      tags: [jellyfin]

    # Tailscale: join the tailnet, then serve the loopback ports on it.
    - name: Add the Tailscale dnf repository
      become: true
      become_user: root
      ansible.builtin.get_url:
        url: https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        dest: /etc/yum.repos.d/tailscale.repo
        owner: root
        group: root
        mode: "0644"
      tags: [tailscale]

    - name: Install base packages (Fedora)
      become: true
      become_user: root
      ansible.builtin.dnf:
        name:
          - ca-certificates
          - curl
          - gnupg2
          - acl
          - python3-passlib
          - moby-engine
          - containerd
          - docker-cli
          - docker-compose
          - docker-buildx
          - python3-docker
          - borgbackup
          - cronie
          - firewalld
          - policycoreutils-python-utils
          - git
          - nginx
          - certbot
          - python3-certbot-nginx
          - python3-pyparsing
          - rclone
          - zlib-devel
          - postgresql-server
          - postgresql-contrib
          - tailscale
          - dnsmasq
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == "RedHat"
      tags: [packages]

    - name: Prompt for fresh 2FA code
      ansible.builtin.pause:
        prompt: "Enter your Proton Drive 2FA code"
        echo: true
      register: rclone_protondrive_2fa
      when: not (testing_mode | default(false) | bool)
      tags: [rclone]

    - name: Configure rclone with fresh 2FA
      ansible.builtin.shell: |
        rclone config create "ProtonDrive" protondrive \
          username "{{ rclone_protondrive_email }}" \
          password "{{ rclone_protondrive_password }}" \
          2fa "{{ rclone_protondrive_2fa.user_input }}"
      args:
        creates: "{{ home_dir }}/.config/rclone/rclone.conf"
      no_log: true
      when: not (testing_mode | default(false) | bool)
      tags: [rclone]

    - name: Configure k3s (disable ServiceLB, which captures host ports 80/443)
      become: true
      become_user: root
      ansible.builtin.blockinfile:
        path: /etc/rancher/k3s/config.yaml
        create: true
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED - disable servicelb"
        block: |
          disable:
            - servicelb
      register: k3s_config
      tags: [k3s]

    - name: Install k3s (lightweight Kubernetes)
      become: true
      become_user: root
      ansible.builtin.shell: |
        set -o pipefail
        if ! systemctl is-active --quiet k3s; then
          curl -sfL https://get.k3s.io | sh -
        fi
      register: k3s_install
      changed_when: k3s_install.stdout | length > 0
      tags: [k3s]

    - name: Install Jellyfin meta-package (server+web)
      become: true
      become_user: root
      ansible.builtin.dnf:
        name: jellyfin
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == "RedHat"
      tags: [jellyfin]

    - name: Enable/start services (docker, nginx, crond, firewalld, jellyfin)
      become: true
      become_user: root
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - docker
        - nginx
        - crond
        - firewalld
        - jellyfin
        - postgresql
        - tailscaled
      tags: [services]

  tasks:
    # Users & permissions
    - name: Allow passwordless sudo for user {{ server_main_user }}
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ server_main_user }}"
        content: "{{ server_main_user }} ALL=(ALL) NOPASSWD:ALL"
        owner: root
        group: root
        mode: "0440"
      tags: [users]

    - name: Ensure borg user exists
      become: true
      become_user: root
      ansible.builtin.user:
        name: "{{ borg_user }}"
        state: present
        home: "/home/{{ borg_user }}"
        shell: "/bin/bash"
      tags: [users, borg]

    - name: Set password for borg user
      become: true
      become_user: root
      ansible.builtin.user:
        name: "{{ borg_user }}"
        password: "{{ borg_password | password_hash('sha512') }}"
        update_password: always
      no_log: true
      tags: [users, borg]

    - name: Ensure docker group exists
      become: true
      become_user: root
      ansible.builtin.group:
        name: docker
        state: present
      tags: [users, docker]

    - name: Add user to docker group - {{ server_main_user }}
      become: true
      become_user: root
      ansible.builtin.user:
        name: "{{ server_main_user }}"
        groups: docker
        append: true
      tags: [users, docker]

    - name: Initialize Postgres cluster
      ansible.builtin.command: postgresql-setup --initdb
      when: not pg_cluster.stat.exists

    # Jellyfin media library (/srv/media, shared with the jellyfin service user)
    - name: Ensure jellyfin group exists
      become: true
      become_user: root
      ansible.builtin.group:
        name: jellyfin
        state: present
      tags: [jellyfin, media]

    - name: Create media directories
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ server_main_user }}"
        group: jellyfin
        mode: "2775"
      loop:
        - "{{ media_dir }}"
        - "{{ media_dir }}/movies"
        - "{{ media_dir }}/series"
      tags: [jellyfin, media]

    - name: Add user to jellyfin group - {{ server_main_user }}
      become: true
      become_user: root
      ansible.builtin.user:
        name: "{{ server_main_user }}"
        groups: jellyfin
        append: true
      tags: [users, jellyfin, media]

    # - name: List SELinux fcontexts
    #   become: true
    #   become_user: root
    #   ansible.builtin.command: semanage fcontext -l
    #   register: selinux_fcontexts
    #   changed_when: false
