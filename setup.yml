    # - name: Apply SELinux context to media dir
    #   become: true
    #   become_user: root
    #   ansible.builtin.command:
    #     argv:
    #       - restorecon
    #       - -R
    #       - "{{ media_dir }}"
    #   changed_when: false
    #   when:
    #     - ansible_facts['selinux'] is defined
    #     - ansible_facts['selinux']['status'] == "enabled"
    #   tags: [jellyfin, media, selinux]

    # WebDAV container
    - name: Create WebDAV data dir
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ dav_dir }}"
        state: directory
        owner: "{{ uid }}"
        group: "{{ gid }}"
        mode: "0755"
      tags: [webdav]

    - name: Run WebDAV container
      become: true
      become_user: root
      community.docker.docker_container:
        name: webdav
        image: "{{ docker_image }}"
        published_ports:
          - "0.0.0.0:8080:80"
        volumes:
          - "{{ dav_dir }}:/data:Z"
        env:
          WEBDAV_USERNAME: "{{ server_main_user }}"
          WEBDAV_PASSWORD: "{{ server_main_password }}"
          PUID: "{{ uid }}"
          PGID: "{{ gid }}"
        restart_policy: always
        state: started
        detach: true
      no_log: true
      tags: [webdav, docker]

    - name: Add cron job for daily WebDAV sync
      become: true
      become_user: root
      ansible.builtin.cron:
        name: "Daily dav sync"
        minute: "0"
        hour: "2"
        job: "/bin/bash {{ sync_script_path }} >> {{ sync_log_path }} 2>&1"
      tags: [obsidian, git]

    - name: Copy sync script to server
      ansible.builtin.copy:
        src: sync-data.sh
        dest: "{{ sync_script_path }}"
        owner: "{{ server_main_user }}"
        group: "{{ server_main_user }}"
        mode: "0755"
      tags: [obsidian, git]

    - name: Replace username placeholder in sync script
      ansible.builtin.replace:
        path: "{{ sync_script_path }}"
        regexp: "insert-user-name-here"
        replace: "{{ server_main_user }}"
      tags: [obsidian, git]

    - name: Replace GitHub token placeholder in sync script
      ansible.builtin.replace:
        path: "{{ sync_script_path }}"
        regexp: 'GITHUB_TOKEN="replace-with-github-token"'
        replace: 'GITHUB_TOKEN="{{ github_token }}"'
      no_log: true
      tags: [obsidian, git]

    # Borg backup
    - name: Ensure borg backup dir exists
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ borg_backup_dir }}"
        state: directory
        owner: "{{ borg_user }}"
        group: "{{ borg_user }}"
        mode: "0755"
      tags: [borg]

    - name: Init borg repository (one-time)
      become: true
      become_user: "{{ borg_user }}"
      ansible.builtin.shell: |
        set -euo pipefail
        export BORG_PASSPHRASE='{{ borg_repo_password }}'
        borg init --encryption=repokey {{ borg_repo_path }}
      args:
        creates: "{{ borg_repo_path }}/config"
      no_log: true
      tags: [borg]

    - name: Fix permissions for borg repo
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ borg_backup_dir }}"
        recurse: true
        owner: "{{ borg_user }}"
        group: "{{ borg_user }}"
        mode: "0755"
      tags: [borg]

    # Firewall & SELinux
    - name: Open HTTP/HTTPS
      become: true
      become_user: root
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - http
        - https
      notify: Reload firewalld
      tags: [firewall]

    - name: Allow nginx outbound network (SELinux)
      become: true
      become_user: root
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true
      when:
        - ansible_facts['selinux'] is defined
        - ansible_facts['selinux']['status'] == "enabled"
      tags: [selinux]

    # ACME webroot + websocket map
    - name: Create ACME webroot
      become: true
      become_user: root
      ansible.builtin.file:
        path: /var/www/certbot/.well-known/acme-challenge
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [nginx, tls]

    - name: Ensure nginx conf.d exists
      become: true
      become_user: root
      ansible.builtin.file:
        path: /etc/nginx/conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [nginx]

    - name: Ensure nginx snippets dir exists
      become: true
      become_user: root
      ansible.builtin.file:
        path: /etc/nginx/snippets
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [nginx, tls]

    - name: Write letsencrypt snippet (serve challenges)
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/nginx/snippets/letsencrypt.conf
        mode: "0644"
        content: |
          location ^~ /.well-known/acme-challenge/ {
              alias /var/www/certbot/.well-known/acme-challenge/;
              default_type "text/plain";
              try_files $uri =404;
          }
      notify: Reload nginx
      tags: [nginx, tls]

    # Nginx reverse proxies (HTTP)
    # NOTE: certbot --nginx rewrites these files to add the 443 server block.
    # Detect existing TLS blocks on the remote host so re-runs never clobber them.
    - name: Check which vhosts already have TLS (certbot-managed)
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - grep
          - -l
          - listen 443
          - /etc/nginx/conf.d/{{ jelly_domain }}.conf
          - /etc/nginx/conf.d/{{ aichat_domain }}.conf
          - /etc/nginx/conf.d/{{ roamermaps_api_domain }}.conf
      register: vhost_tls_files
      changed_when: false
      failed_when: vhost_tls_files.rc not in [0, 1, 2]
      tags: [nginx]

    - name: Proxy for {{ jelly_domain }}
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/{{ jelly_domain }}.conf
        mode: "0644"
        content: |
          server {
              listen 80;
              listen [::]:80;
              server_name {{ jelly_domain }};

              include /etc/nginx/snippets/letsencrypt.conf;

              location / {
                  proxy_pass         http://127.0.0.1:8096;
                  proxy_set_header   Host              $host;
                  proxy_set_header   X-Real-IP         $remote_addr;
                  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                  proxy_set_header   X-Forwarded-Proto $scheme;
                  proxy_read_timeout 90;
              }
          }
      notify: Reload nginx
      when: ('/etc/nginx/conf.d/' ~ jelly_domain ~ '.conf') not in vhost_tls_files.stdout_lines
      tags: [nginx]

    - name: Serve ACME challenges for {{ tailnet_names | join(', ') }}
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/{{ item }}.conf
        mode: "0644"
        content: |
          server {
              listen 80;
              listen [::]:80;
              server_name {{ item }};

              include /etc/nginx/snippets/letsencrypt.conf;
          }
      loop: "{{ tailnet_names }}"
      notify: Reload nginx
      tags: [nginx, tls]

    - name: Proxy for {{ aichat_domain }}
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: "/etc/nginx/conf.d/{{ aichat_domain }}.conf"
        mode: "0644"
        content: |
          server {
              listen 80;
              listen [::]:80;
              server_name {{ aichat_domain }};
              client_max_body_size 5000M;

              include /etc/nginx/snippets/letsencrypt.conf;

              location / {
                  proxy_pass         http://127.0.0.1:{{ aichat_web_port }};

                  proxy_http_version 1.1;
                  proxy_buffering off;
                  proxy_set_header   Host              $host;
                  proxy_set_header   X-Real-IP         $remote_addr;
                  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                  proxy_set_header   X-Forwarded-Proto $scheme;
                  proxy_set_header   Upgrade           $http_upgrade;
                  proxy_set_header   Connection        "upgrade";
                  proxy_read_timeout 300;
              }
          }
      notify: Reload nginx
      when: ('/etc/nginx/conf.d/' ~ aichat_domain ~ '.conf') not in vhost_tls_files.stdout_lines
      tags: [nginx]

    - name: Proxy for k3s ingress ({{ roamermaps_api_domain }})
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: "/etc/nginx/conf.d/{{ roamermaps_api_domain }}.conf"
        mode: "0644"
        content: |
          server {
              listen 80;
              listen [::]:80;
              server_name {{ roamermaps_api_domain }};
              client_max_body_size 5000M;

              include /etc/nginx/snippets/letsencrypt.conf;

              location / {
                  proxy_pass         http://127.0.0.1:{{ roamermaps_api_port }};
                  proxy_set_header   Host              $host;
                  proxy_set_header   X-Real-IP         $remote_addr;
                  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                  proxy_set_header   X-Forwarded-Proto $scheme;
                  proxy_read_timeout 600s;
                  proxy_send_timeout 600s;
                  send_timeout       600s;
              }
          }
      notify: Reload nginx
      when: ('/etc/nginx/conf.d/' ~ roamermaps_api_domain ~ '.conf') not in vhost_tls_files.stdout_lines
      tags: [nginx]

    - name: Test nginx config
      become: true
      become_user: root
      ansible.builtin.command: nginx -t
      register: nginx_test
      changed_when: false
      failed_when: nginx_test.rc != 0
      tags: [nginx]

    - name: Add cni0 to firewalld trusted zone (k3s pod networking)
      become: true
      become_user: root
      ansible.posix.firewalld:
        zone: trusted
        interface: cni0
        permanent: true
        state: enabled
        immediate: true
      notify: Reload firewalld
      tags: [firewall, k3s]

    # k3s post-install: kubeconfig, data dir, manifests

    - name: Wait for k3s node to be Ready
      become: true
      become_user: root
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl wait --for=condition=Ready node --all --timeout=120s
      changed_when: false
      tags: [k3s]

    - name: Ensure .kube dir exists in user home
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ home_dir }}/.kube"
        state: directory
        owner: "{{ server_main_user }}"
        group: "{{ server_main_user }}"
        mode: "0700"
      tags: [k3s]

    - name: Copy kubeconfig to user home
      become: true
      become_user: root
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ home_dir }}/.kube/config"
        owner: "{{ server_main_user }}"
        group: "{{ server_main_user }}"
        mode: "0600"
        remote_src: true
      tags: [k3s]

    - name: Ensure hostPath data dir exists (user-writable for scp)
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ roamermaps_data_dir }}"
        state: directory
        owner: "{{ server_main_user }}"
        group: "{{ server_main_user }}"
        mode: "0755"
      tags: [roamermaps, k3s]

    - name: Wait for RoamerMaps data files on server
      ansible.builtin.pause:
        prompt: |
          Copy the RoamerMaps data files to {{ roamermaps_data_dir }}/ to the server:
            {{ roamermaps_data_files | join(', ') }}
          scp {{ roamermaps_data_files | join(' ') }} {{ server_main_user }}@<host>:{{ roamermaps_data_dir }}/
      tags: [roamermaps, k3s]

    - name: Check RoamerMaps data files were copied
      ansible.builtin.stat:
        path: "{{ roamermaps_data_dir }}/{{ item }}"
      register: roamermaps_data
      loop: "{{ roamermaps_data_files }}"
      tags: [roamermaps, k3s]

    - name: Fail if any data file is missing
      ansible.builtin.assert:
        that: roamermaps_data.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: "Missing data files in {{ roamermaps_data_dir }}/ - copy over files {{ roamermaps_data_files | join(', ') }} and re-run"
      tags: [roamermaps, k3s]

    - name: Ensure deployment clone parent dir exists
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ roamermaps_k8s_dir | dirname }}"
        state: directory
        owner: "{{ server_main_user }}"
        group: "{{ server_main_user }}"
        mode: "0755"
      tags: [roamermaps, k3s]

    - name: Check if deployment repo is already cloned
      ansible.builtin.stat:
        path: "{{ roamermaps_k8s_dir }}/.git"
      register: roamermaps_git_dir
      tags: [roamermaps, k3s]

    - name: Clone RoamerMaps deployment repo (manifests)
      ansible.builtin.git:
        repo: "{{ roamermaps_deployment_repo | regex_replace('^https://', 'https://oauth2:' + gitlab_deployment_token + '@') }}"
        dest: "{{ roamermaps_k8s_dir }}"
        version: main
        update: true
        force: true
      no_log: true
      when: not roamermaps_git_dir.stat.exists
      tags: [roamermaps, k3s]

    - name: Point seed-data Job hostPath at this server's user
      ansible.builtin.replace:
        path: "{{ roamermaps_k8s_dir }}/seed-data-job.yaml"
        regexp: "/home/hubserv/apps/roamermaps/data"
        replace: "{{ roamermaps_data_dir }}"
      tags: [roamermaps, k3s]

    - name: Write .env for deploy.sh (registry credentials)
      ansible.builtin.copy:
        dest: "{{ roamermaps_k8s_dir }}/.env"
        content: |
          GITLAB_REGISTRY_USERNAME={{ gitlab_registry_username }}
          GITLAB_REGISTRY_PASSWORD={{ gitlab_registry_password }}
          GITLAB_REGISTRY_EMAIL={{ certbot_email }}
        owner: "{{ server_main_user }}"
        group: "{{ server_main_user }}"
        mode: "0600"
      no_log: true
      tags: [roamermaps, k3s]

    - name: Check if RoamerMaps back-end is already deployed
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl get deployment back-end -n roamermaps -o jsonpath='{.status.readyReplicas}'
      environment:
        KUBECONFIG: "{{ home_dir }}/.kube/config"
      register: roamermaps_deployed
      failed_when: false
      changed_when: false
      tags: [roamermaps, k3s]

    - name: Deploy RoamerMaps
      ansible.builtin.command:
        cmd: ./deploy.sh
        chdir: "{{ roamermaps_k8s_dir }}"
      environment:
        KUBECONFIG: "{{ home_dir }}/.kube/config"
        GITLAB_REGISTRY_USERNAME: "{{ gitlab_registry_username }}"
        GITLAB_REGISTRY_PASSWORD: "{{ gitlab_registry_password }}"
        GITLAB_REGISTRY_EMAIL: "{{ certbot_email }}"
      changed_when: true
      no_log: false
      when: roamermaps_deployed.stdout | default('0') | int == 0
      tags: [roamermaps, k3s]

    - name: Issue cert for {{ jelly_domain }}
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - certbot
          - --nginx
          - -d
          - "{{ jelly_domain }}"
          - --non-interactive
          - --agree-tos
          - --email
          - "{{ certbot_email }}"
          - --redirect
      register: certbot_jelly
      changed_when: certbot_jelly.stdout is search('Certificate not yet due for renewal') | ternary(false, certbot_jelly.rc == 0)
      when: not (testing_mode | default(false) | bool)
      tags: [tls]

    - name: Issue cert for {{ aichat_domain }}
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - certbot
          - --nginx
          - -d
          - "{{ aichat_domain }}"
          - --non-interactive
          - --agree-tos
          - --email
          - "{{ certbot_email }}"
          - --redirect
      register: certbot_aichat
      changed_when: certbot_aichat.stdout is search('Certificate not yet due for renewal') | ternary(false, certbot_aichat.rc == 0)
      when: not (testing_mode | default(false) | bool)
      tags: [tls]

    - name: Issue cert for {{ roamermaps_api_domain }}
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - certbot
          - --nginx
          - -d
          - "{{ roamermaps_api_domain }}"
          - --non-interactive
          - --agree-tos
          - --email
          - "{{ certbot_email }}"
          - --redirect
      register: certbot_roamermaps
      changed_when: certbot_roamermaps.stdout is search('Certificate not yet due for renewal') | ternary(false, certbot_roamermaps.rc == 0)
      when: not (testing_mode | default(false) | bool)
      tags: [tls]

    # The vhosts for these names are tailnet-only and hand-written, so certbot
    # must not run its nginx installer (it would add a wildcard 443 listener).
    - name: Reload nginx so the ACME vhosts are live before issuance
      become: true
      become_user: root
      ansible.builtin.service:
        name: nginx
        state: reloaded
      tags: [nginx, tls]

    - name: Check the renewal authenticator for {{ immich_domain }}
      ansible.builtin.command: grep -c "^authenticator = nginx" /etc/letsencrypt/renewal/{{ immich_domain }}.conf
      register: immich_renewal_auth
      changed_when: false
      failed_when: false
      tags: [tls]

    - name: Move the renewal to the webroot authenticator for {{ immich_domain }}
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - certbot
          - renew
          - --cert-name
          - "{{ immich_domain }}"
          - --webroot
          - -w
          - /var/www/certbot
          - --force-renewal
          - --non-interactive
      changed_when: true
      when:
        - not (testing_mode | default(false) | bool)
        - immich_renewal_auth.stdout | trim == "1"
      tags: [tls]

    - name: Drop the nginx installer from the renewal config for {{ immich_domain }}
      become: true
      become_user: root
      ansible.builtin.replace:
        path: /etc/letsencrypt/renewal/{{ immich_domain }}.conf
        regexp: "^installer = nginx$"
        replace: "# installer removed — the vhost is hand-written and tailnet-only"
      tags: [tls]

    - name: Issue cert for {{ lector_domain }}
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - certbot
          - certonly
          - --webroot
          - -w
          - /var/www/certbot
          - -d
          - "{{ lector_domain }}"
          - --non-interactive
          - --agree-tos
          - --email
          - "{{ certbot_email }}"
      register: certbot_lector
      changed_when: certbot_lector.stdout is search('Certificate not yet due for renewal') | ternary(false, certbot_lector.rc == 0)
      when: not (testing_mode | default(false) | bool)
      tags: [tls]

    - name: Restore SELinux contexts for certbot paths
      become: true
      become_user: root
      ansible.builtin.command: restorecon -Rv /etc/letsencrypt /var/www/certbot
      changed_when: false
      when:
        - ansible_facts['selinux'] is defined
        - ansible_facts['selinux']['status'] == "enabled"
      tags: [tls, selinux]

    - name: Restart nginx after TLS issuance
      become: true
      become_user: root
      ansible.builtin.service:
        name: nginx
        state: restarted
      tags: [nginx, tls]

    - name: Install certbot renew systemd service
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/systemd/system/certbot-renew.service
        mode: "0644"
        content: |
          [Unit]
          Description=Certbot renew
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/certbot renew --quiet --deploy-hook "systemctl reload nginx"
      tags: [tls]

    - name: Install certbot renew systemd timer
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/systemd/system/certbot-renew.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Twice-daily certbot renew

          [Timer]
          OnCalendar=*-*-* 03,15:00:00
          RandomizedDelaySec=1800
          Persistent=true

          [Install]
          WantedBy=timers.target
      tags: [tls]

    - name: Enable and start certbot-renew.timer
      become: true
      become_user: root
      ansible.builtin.systemd:
        name: certbot-renew.timer
        state: started
        enabled: true
        daemon_reload: true
      tags: [tls]

    # Setup Open WebUI
    - name: Ensure ~/apps/aichat exists
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ aichat_dir }}"
        state: directory
        owner: "{{ server_main_user }}"
        group: "{{ server_main_user }}"
        mode: "0755"
      tags: [aichat, docker]

    - name: Copy docker compose for AI chat
      become: true
      become_user: root
      ansible.builtin.template:
        src: open-webui-docker-compose.yml
        dest: "{{ aichat_compose_path }}"
        owner: "{{ server_main_user }}"
        group: "{{ server_main_user }}"
        mode: "0644"
      tags: [aichat, docker]

    - name: Replace OpenRouter API key placeholder in compose file
      become: true
      become_user: root
      ansible.builtin.replace:
        path: "{{ aichat_compose_path }}"
        regexp: "%openrouter_api_key%"
        replace: "{{ openrouter_api_key }}"
      no_log: true
      tags: [aichat, docker]

    - name: Replace Brave API key placeholder in compose file
      become: true
      become_user: root
      ansible.builtin.replace:
        path: "{{ aichat_compose_path }}"
        regexp: "%brave_api_key%"
        replace: "{{ brave_api_key }}"
      no_log: true
      tags: [aichat, docker]

    - name: Replace domain placeholder in compose file
      become: true
      become_user: root
      ansible.builtin.replace:
        path: "{{ aichat_compose_path }}"
        regexp: "%aichat_domain%"
        replace: "{{ aichat_domain }}"
      no_log: true
      tags: [aichat, docker]

    - name: Copy settings config for searxng
      become: true
      become_user: root
      ansible.builtin.template:
        src: searxng_settings.yml
        dest: "{{ searxng_settings_path }}"
        owner: "{{ server_main_user }}"
        group: "{{ server_main_user }}"
        mode: "0644"
      tags: [aichat, docker]

    - name: Bring up AI chat compose
      community.docker.docker_compose_v2:
        project_src: "{{ aichat_dir }}"
        state: present
      register: aichat_up
      until: aichat_up is not failed
      retries: 5
      delay: 60
      tags: [aichat, docker]

    - name: Read tailnet state
      ansible.builtin.command: tailscale status --json
      register: tailscale_status
      changed_when: false
      failed_when: false
      tags: [tailscale, docker]

    - name: Join the tailnet
      become: true
      become_user: root
      ansible.builtin.command:
        argv: "{{ tailscale_up_argv }}"
      when:
        - (tailscale_status.stdout | default('{}', true) | from_json).BackendState | default('') != 'Running'
        - tailscale_authkey | length > 0
      changed_when: true
      no_log: true
      tags: [tailscale, docker]

    - name: Read the node's tailnet DNS name
      ansible.builtin.command: tailscale status --json
      register: tailscale_node
      changed_when: false
      tags: [tailscale, docker]

    - name: Record the tailnet DNS name
      ansible.builtin.set_fact:
        tailscale_dns_name: "{{ (tailscale_node.stdout | from_json).Self.DNSName | regex_replace('\\.$', '') }}"
      tags: [tailscale, docker]

    - name: Read the tailnet IPv4
      become: true
      become_user: root
      ansible.builtin.command: tailscale ip -4
      register: tailscale_ip_cmd
      changed_when: false
      tags: [tailscale, docker]

    - name: Record the tailnet IP
      ansible.builtin.set_fact:
        tailscale_ip: "{{ tailscale_ip_cmd.stdout | trim }}"
      tags: [tailscale, docker]

    - name: Trust the Tailscale interface (tailnet peers only)
      become: true
      become_user: root
      ansible.posix.firewalld:
        zone: trusted
        interface: tailscale0
        permanent: true
        state: enabled
        immediate: true
      notify: Reload firewalld
      tags: [firewall, tailscale]

    - name: Resolve the service names to the tailnet IP over dnsmasq
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: "{{ tailnet_dnsmasq_file }}"
        mode: "0644"
        content: |
          listen-address={{ tailscale_ip }}
          bind-dynamic
          no-resolv
          server=1.1.1.1
          {% for name in tailnet_names %}
          address=/{{ name }}/{{ tailscale_ip }}
          {% endfor %}
      notify: Restart dnsmasq
      tags: [tailscale, dns]

    - name: Enable and start dnsmasq
      become: true
      become_user: root
      ansible.builtin.systemd:
        name: dnsmasq
        enabled: true
        state: started
      tags: [tailscale, dns]

    - name: Tailnet proxy for {{ immich_domain }}
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/{{ immich_domain }}-tailnet.conf
        mode: "0644"
        content: |
          server {
              listen {{ tailscale_ip }}:443 ssl;
              server_name {{ immich_domain }};
              client_max_body_size 5000M;

              ssl_certificate     /etc/letsencrypt/live/{{ immich_domain }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ immich_domain }}/privkey.pem;

              proxy_set_header Host              $http_host;
              proxy_set_header X-Real-IP         $remote_addr;
              proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_http_version 1.1;
              proxy_set_header Upgrade           $http_upgrade;
              proxy_set_header Connection        "upgrade";

              proxy_read_timeout  600s;
              proxy_send_timeout  600s;
              send_timeout        600s;

              location / {
                  proxy_pass http://127.0.0.1:2283;
              }
          }
      notify: Reload nginx
      tags: [nginx, immich, tailscale]

    - name: Tailnet proxy for {{ lector_domain }}
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/{{ lector_domain }}-tailnet.conf
        mode: "0644"
        content: |
          server {
              listen {{ tailscale_ip }}:443 ssl;
              server_name {{ lector_domain }};
              client_max_body_size 5000M;

              ssl_certificate     /etc/letsencrypt/live/{{ lector_domain }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ lector_domain }}/privkey.pem;

              proxy_http_version 1.1;
              proxy_buffering off;
              proxy_set_header Host              $host;
              proxy_set_header X-Real-IP         $remote_addr;
              proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade           $http_upgrade;
              proxy_set_header Connection        "upgrade";
              proxy_read_timeout 600s;

              location / {
                  proxy_pass http://127.0.0.1:3400;
              }

              location /api/ {
                  proxy_pass http://127.0.0.1:3457;
              }
          }
      notify: Reload nginx
      tags: [nginx, lector, tailscale]

    - name: Serve the service ports to the tailnet
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - tailscale
          - serve
          - --bg
          - --yes
          - "--https={{ item }}"
          - "http://127.0.0.1:{{ item }}"
      loop: "{{ tailscale_ports }}"
      changed_when: false
      tags: [tailscale, docker]

    - name: Install Immich
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://raw.githubusercontent.com/immich-app/immich/main/install.sh | bash
      args:
        chdir: "{{ apps_dir }}"
        creates: "{{ immich_dir }}/docker-compose.yml"
      register: immich_up
      until: immich_up is not failed
      retries: 5
      delay: 60
      tags: [immich]

    - name: Add SELinux shared labels to Immich bind mounts
      ansible.builtin.replace:
        path: "{{ immich_dir }}/docker-compose.yml"
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
      loop:
        - regexp: '\$\{UPLOAD_LOCATION\}:/data$'
          replace: "${UPLOAD_LOCATION}:/data:z"
        - regexp: '\$\{DB_DATA_LOCATION\}:/var/lib/postgresql/data$'
          replace: "${DB_DATA_LOCATION}:/var/lib/postgresql/data:z"
      tags: [immich]

    - name: Bind Immich to loopback
      ansible.builtin.replace:
        path: "{{ immich_dir }}/docker-compose.yml"
        regexp: "^(\\s*)-\\s*['\"]?2283:2283['\"]?$"
        replace: "\\1- '127.0.0.1:2283:2283'"
      tags: [immich, tailscale]

    - name: Bring up Immich compose
      community.docker.docker_compose_v2:
        project_src: "{{ immich_dir }}"
        state: present
      register: immich_compose_up
      until: immich_compose_up is not failed
      retries: 5
      delay: 60
      tags: [immich]

    # Setup Lector (OpenRouter-backed LLM)
    - name: Ensure ~/apps/lector exists
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ lector_dir }}"
        state: directory
        owner: "{{ server_main_user }}"
        group: "{{ server_main_user }}"
        mode: "0755"
      tags: [lector, docker]

    - name: Ensure Lector data dir exists
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ lector_dir }}/data"
        state: directory
        owner: "{{ lector_uid }}"
        group: "{{ lector_gid }}"
        mode: "0755"
      tags: [lector, docker]

    - name: Repair ownership inside the Lector data dir
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ lector_dir }}/data"
        state: directory
        owner: "{{ lector_uid }}"
        group: "{{ lector_gid }}"
        recurse: true
      tags: [lector, docker]

    - name: Copy docker compose for Lector
      become: true
      become_user: root
      ansible.builtin.template:
        src: lector-docker-compose.yml
        dest: "{{ lector_compose_path }}"
        owner: "{{ server_main_user }}"
        group: "{{ server_main_user }}"
        mode: "0644"
      tags: [lector, docker]

    - name: Replace OpenRouter API key placeholder in Lector compose file
      become: true
      become_user: root
      ansible.builtin.replace:
        path: "{{ lector_compose_path }}"
        regexp: "%openrouter_api_key%"
        replace: "{{ openrouter_api_key }}"
      no_log: true
      tags: [lector, docker]

    - name: Replace API URL placeholder in Lector compose file
      become: true
      become_user: root
      ansible.builtin.replace:
        path: "{{ lector_compose_path }}"
        regexp: "%lector_api_url%"
        replace: "{{ lector_api_url }}"
      tags: [lector, docker]

    - name: Bring up Lector compose
      community.docker.docker_compose_v2:
        project_src: "{{ lector_dir }}"
        state: present
      register: lector_up
      until: lector_up is not failed
      retries: 5
      delay: 60
      tags: [lector, docker]

  handlers:
    - name: Reload firewalld
      become: true
      become_user: root
      ansible.builtin.service:
        name: firewalld
        state: reloaded

    - name: Reload nginx
      become: true
      become_user: root
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Restart dnsmasq
      become: true
      become_user: root
      ansible.builtin.service:
        name: dnsmasq
        state: restarted
